name: Nueva Clase

on:
  workflow_dispatch:
    inputs:
      numero:
        description: 'Número de clase (2 dígitos)'
        required: true
        default: '00'
      fecha:
        description: 'Fecha de la sesión (ej. 1 de septiembre)'
        required: true
        default: ''
      tema:
        description: 'Tema de la sesión'
        required: true
        default: ''
      que_vimos_hoy:
        description: '¿Qué vimos hoy?'
        required: false
        default: ''

jobs:
  crear-clase:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear carpeta y README de la clase
        run: |
          CARPETA="clase-${{ github.event.inputs.numero }}"
          mkdir -p "$CARPETA"
          
          # Quitar el cero inicial para el encabezado (ej. 04 -> 4)
          NUM_SIN_CERO=$(echo "${{ github.event.inputs.numero }}" | sed 's/^0*//')
          [ -z "$NUM_SIN_CERO" ] && NUM_SIN_CERO="0"

          cat << EOF > "$CARPETA/README.md"
          # CLASE ${NUM_SIN_CERO}: ${{ github.event.inputs.tema }}

          **Fecha:** ${{ github.event.inputs.fecha }} de 2026

          ## ¿Qué vimos hoy?

          ${{ github.event.inputs.que_vimos_hoy }}
          EOF

      - name: Agregar fila a la tabla del README principal
        run: |
          echo "| ${{ github.event.inputs.numero }} | ${{ github.event.inputs.fecha }} | ${{ github.event.inputs.tema }} | [Ver clase](./clase-${{ github.event.inputs.numero }}/) |" >> README.md

      - name: Guardar y subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "ci: automatizar creación de bitácoras por sesión"
          git push
