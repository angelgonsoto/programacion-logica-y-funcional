<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" height="280">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 10px; stroke: #30363d; stroke-width: 1.5; }
      .bar { fill: #161b22; }
      .dot-r { fill: #ff5f56; }
      .dot-y { fill: #ffbd2e; }
      .dot-g { fill: #27c93f; }
      .title { fill: #8b949e; font-family: monospace; font-size: 13px; font-weight: bold; }
      .txt { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 14px; fill: #58a6ff; }
      .txt-out { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 14px; fill: #7ee787; }
      .txt-val { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 14px; fill: #e6edf3; }
      .cursor { fill: #58a6ff; animation: blink 0.8s infinite; }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* Efectos de aparición secuencial */
      .step1 { opacity: 0; animation: fadeIn 0.1s forwards 0.5s; }
      .step2 { opacity: 0; animation: fadeIn 0.1s forwards 1.4s; }
      .step3 { opacity: 0; animation: fadeIn 0.1s forwards 1.8s; }
      .step4 { opacity: 0; animation: fadeIn 0.1s forwards 2.2s; }
      .step5 { opacity: 0; animation: fadeIn 0.1s forwards 2.6s; }
      .step6 { opacity: 0; animation: fadeIn 0.1s forwards 3.0s; }
      .step7 { opacity: 0; animation: fadeIn 0.1s forwards 3.4s; }

      @keyframes fadeIn {
        to { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Ventana de terminal -->
  <rect width="760" height="280" class="bg"/>
  <rect width="760" height="36" rx="10" class="bar"/>
  <rect width="760" height="10" y="26" class="bar"/>
  
  <!-- Botones de ventana -->
  <circle cx="20" cy="18" r="6" class="dot-r"/>
  <circle cx="38" cy="18" r="6" class="dot-y"/>
  <circle cx="56" cy="18" r="6" class="dot-g"/>
  <text x="380" y="23" text-anchor="middle" class="title">swipl — evaluando predicado: alumno/4</text>

  <!-- Contenido interactivo -->
  <g transform="translate(25, 65)">
    <!-- Consulta inicial estilo Prolog -->
    <text y="20" class="txt">?- consultar(estudiante_bitacora).</text>
    
    <g class="step1">
      <text y="45" class="txt-out">true.</text>
    </g>

    <g class="step2">
      <text y="75" class="txt">?- alumno(Nombre, Materia, Carrera, Grupo).</text>
    </g>

    <!-- Resultados con tus datos exactos -->
    <g class="step3">
      <text y="105" class="txt-out">Nombre   <tspan class="txt-val">= 'Ángel Alberto González Soto',</tspan></text>
    </g>
    <g class="step4">
      <text y="130" class="txt-out">Materia  <tspan class="txt-val">= 'Programación Lógica y Funcional',</tspan></text>
    </g>
    <g class="step5">
      <text y="155" class="txt-out">Carrera  <tspan class="txt-val">= 'Ingeniería en Tecnologías de la Información',</tspan></text>
    </g>
    <g class="step6">
      <text y="180" class="txt-out">Grupo    <tspan class="txt-val">= 'LICD401'.</tspan></text>
    </g>

    <!-- Cursor parpadeante final -->
    <g class="step7">
      <text y="210" class="txt">?- <rect x="25" y="197" width="8" height="15" class="cursor"/></text>
    </g>
  </g>
</svg>
